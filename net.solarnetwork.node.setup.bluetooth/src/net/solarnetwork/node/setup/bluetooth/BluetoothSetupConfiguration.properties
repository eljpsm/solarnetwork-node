title = Bluetooth Setup
desc = Turn the Bluetooth setup radio on only while it is needed: while the configured \
	operational mode is active, while SolarNetwork has been unreachable for a period of time, \
	or always.

status.key = Status
status.desc = The current Bluetooth setup radio state and why it is on.

enableMinutes.key = Enable For
enableMinutes.desc = Enter a number of minutes to turn the radio on for, by enabling the \
	operational mode with an expiration. The value returns to <code>0</code> once applied.

alwaysOn.key = Always On
alwaysOn.desc = Toggle on to keep the radio on at all times.

opMode.key = Operational Mode
opMode.desc = The operational mode that turns the radio on while it is active. Enable it from \
	SolarNetwork with the <code>EnableOperationalModes</code> instruction and an \
	<code>Expiration</code>.

defaultDurationSeconds.key = Default Duration
defaultDurationSeconds.desc = The number of seconds to enable the radio for when an \
	<code>enable</code> request does not include a duration.

maxDurationSeconds.key = Maximum Duration
maxDurationSeconds.desc = The maximum number of seconds the radio can be enabled for in a \
	single <code>enable</code> request. Use <code>0</code> for no limit.

offlineTriggerEnabled.key = Offline Trigger
offlineTriggerEnabled.desc = Toggle on to turn the radio on automatically while the node is \
	unable to reach SolarNetwork.

offlineThresholdMinutes.key = Offline Threshold
offlineThresholdMinutes.desc = The number of minutes SolarNetwork must be unreachable before \
	the radio turns on.

onlineGraceMinutes.key = Online Grace
onlineGraceMinutes.desc = The number of minutes to keep the radio on after SolarNetwork \
	becomes reachable again.

watchdogIntervalSeconds.key = Check Interval
watchdogIntervalSeconds.desc = The number of seconds between SolarNetwork connectivity checks. \
	Use <code>0</code> to disable the checks.

pingTestIdRegex.key = Ping Test ID
pingTestIdRegex.desc = A regular expression matching the ID of the ping test that indicates \
	SolarNetwork connectivity. If no matching test exists the offline trigger never fires.

command.key = Command
command.desc = The <code>solarcfg</code> system command to execute.

status.on = On
status.off = Off
status.unknown = Unknown
status.alwaysOn = always on
status.opMode = operational mode ''{0}'' active until {1}
status.noExpiry = no expiry
status.offline = SolarNetwork unreachable since {0}

error.unsupportedAction = Unsupported bluetooth action ''{0}''. Supported actions are 'status', 'enable', 'disable', and 'restart'.
