###############################################################################
# net.solarnetwork.node.upload.mqtt Configuration Admin properties
###############################################################################

###############################################################################
# client.keepAliveInterval <seconds>
# 
# The MQTT keep-alive (PING) interval, in seconds. Set to 0 to disable.

client.keepAliveInterval = 60

###############################################################################
# client.maximumMessageSize <bytes>
# 
# The maximum MQTT message size, in bytes, for both published and received
# messages. Must be between 1 and 256000000. The SolarIn MQTT server must also
# accept messages of this size.

client.maximumMessageSize = 8192
